      <path d="M6 30h5l5-9h26l9 9h6a3 3 0 0 1 3 3v4H3v-4a3 3 0 0 1 3-3Z" fill="#ff977f" stroke="#f2d3bd" stroke-width="1.5"/>

      <path d="m19 23-4 7h13v-7Zm12 0v7h13l-7-7Z" fill="#4b4333"/>

    </svg>
  </div>
  <div class="road-car road-car-lower-two" aria-hidden="true">
    <svg viewBox="0 0 70 48" focusable="false">
      <path d="M6 30h5l5-9h26l9 9h6a3 3 0 0 1 3 3v4H3v-4a3 3 0 0 1 3-3Z" fill="#c493df" stroke="#ead9f2" stroke-width="1.5"/>

      <circle cx="63" cy="35" r="2" fill="#ffc36a"/>

      <rect x="24" y="16" width="10" height="12" rx="2" fill="#76cde0" stroke="#d8e5d2" stroke-width="1.5"/>
      <path d="m35 14 5-6 7 2-1 7-6 3" fill="#ff977f" stroke="#d8e5d2" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="m38 9 2-4 7 1 2 4" fill="#ffc36a" stroke="#d8e5d2" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="app" id="app" hidden>
    <header class="bar">
      <div class="brand"><span class="mark">Q</span><div><strong>Quazar Rider</strong><small id="rider-name">Rider</small></div></div>
      <div class="bar-right">
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="icon-btn" id="logout" type="button" aria-label="Log out" title="Log out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Deliveries">
      <button class="tab active" type="button" data-tab="todo">To pick up <b id="c-todo">0</b></button>
      <button class="tab" type="button" data-tab="ontheway">On the way <b id="c-ontheway">0</b></button>
      <button class="tab" type="button" data-tab="done">Delivered <b id="c-done">0</b></button>
    </nav>

    <p class="notice" id="notice" role="status" hidden></p>
    <main class="list" id="list"></main>
  </div>

  <div class="modal logout-modal" id="logout-modal" hidden>
    <section class="sheet logout-sheet" role="alertdialog" aria-modal="true" aria-labelledby="logout-title" aria-describedby="logout-message" tabindex="-1">
      <p class="eyebrow">Rider account</p>
      <h2 id="logout-title">Are you sure you want to log out?</h2>
      <p class="hint" id="logout-message"></p>
      <div class="logout-actions">
        <button class="btn ghost" id="logout-cancel" type="button">Stay signed in</button>
        <button class="btn danger" id="logout-confirm" type="button">Log out</button>
      </div>
    </section>
  </div>

  <!-- proof of delivery -->
  <div class="modal" id="proof-modal" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="proof-title">
      <div class="sheet-head"><div><p class="eyebrow">Proof of delivery</p><h2 id="proof-title">Order</h2></div><button class="icon-btn" id="proof-close" type="button" aria-label="Close">×</button></div>
      <p class="hint">Take a clear photo of the item handed to the customer (or the item at their door).</p>
      <label class="camera-btn" for="proof-input"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> <span id="camera-label">Open camera</span></label>
      <input id="proof-input" type="file" accept="image/*" capture="environment" hidden>
      <img id="proof-preview" alt="Photo preview" hidden>
      <label class="check" id="cod-wrap" hidden><input id="cod-collected" type="checkbox"> <span>I collected <b id="cod-amount"></b> cash from the customer</span></label>
      <p class="error" id="proof-error" role="alert"></p>
      <div class="sheet-actions">
        <button class="btn ghost" id="proof-cancel" type="button">Cancel</button>
        <button class="btn" id="proof-submit" type="button" disabled>Confirm delivered</button>
      </div>
    </section>
  </div>

  <div class="gate" id="gate" hidden>
    <div class="mark big">Q</div><h1 id="gate-title">Rider access required</h1><p id="gate-message">Sign in with a rider account to continue.</p>
    <a class="btn" href="/#account">Go to sign in</a>
  </div>
  <script src="/rider.js?v=rider-pickup-route-fix" defer></script>
</body>
</html>
